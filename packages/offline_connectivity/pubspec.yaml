name: offline_connectivity
description: Native connection adapter for Offline Group Messenger.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.offlinegroupmessenger.offline_connectivity
        pluginClass: OfflineConnectivityPlugin
      ios:
        pluginClass: OfflineConnectivityPlugin
